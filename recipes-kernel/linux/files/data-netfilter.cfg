# Kernel config fragment for data layer netfilter features.
# Enables conntrack netlink interface (required by conntrack userspace utility),
# network namespaces (required by ip netns), and nftables netlink support.
CONFIG_NF_CONNTRACK=y
CONFIG_NF_CONNTRACK_EVENTS=y
CONFIG_NF_CONNTRACK_CHAIN_EVENTS=y
CONFIG_NF_CONNTRACK_MARK=y
CONFIG_NFNETLINK=y
CONFIG_NF_CONNTRACK_NETLINK=y
CONFIG_NET_NS=y
CONFIG_NF_NAT=y
CONFIG_NF_NAT_REDIRECT=y
CONFIG_NF_NAT_MASQUERADE=y
CONFIG_NETFILTER_XT_TARGET_CONNMARK=y
CONFIG_NETFILTER_XT_TARGET_CT=y
