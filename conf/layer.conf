BBFILES += "${LAYERDIR}/recipes/*/*.bb \
            ${LAYERDIR}/recipes/*/*.bbappend \
            ${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend \
            ${LAYERDIR}/recipes-products/images/*.bbappend \
            ${LAYERDIR}/recipes-support/*/*.bbappend"

BBFILES += "${@bb.utils.contains('BASEMACHINE', 'echo', \
           '${LAYERDIR}/rdkb/recipes-*/*/*.bb ${LAYERDIR}/rdkb/recipes-*/*/*.bbappend', \
           '', d)}"
BBMASK:append:echo = " ^.*/linux-qcom-custom_.*\.bbappend$"
BBMASK:append:sa535m = " ^.*/linux-msm-src_.*\.bbappend$"

BBPATH .= ":${LAYERDIR}"
BBFILE_COLLECTIONS += "qti-data"
BBFILE_PRIORITY_qti-data = "12"
BBFILE_PATTERN_qti-data := "^${LAYERDIR}/"
UNPACKDIR ??= "${WORKDIR}"

LAYERSERIES_COMPAT_qti-data = "dunfell kirkstone scarthgap wrynose"
require conf/machine/include/rdkb-distro-data.inc
