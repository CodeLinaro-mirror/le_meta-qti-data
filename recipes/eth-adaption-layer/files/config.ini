#***********Readme*************#

#qlocal_ip=192.168.1.3
#Description :- The local ip address of the connected device.(Mandatory parameter)
#Supports:- IPv4 or IPv6 not both meaning IPv4v6
#Userintervention:- change it on remote device to ip address of qremote_ip

#qremote_ip=192.168.1.5
#Description :- The Remote ip address of the remote connected device.(Mandatory parameter)
#Supports:- IPv4 or IPv6 not both (meaning IPv4v6)
#Userintervention:- change it on remote device to ip address of qlocal_ip

#Uncomment the below to support IPv6 and comment out the IPv4
#qlocal_ip=192.168.1.3 and qremote_ip=192.168.1.5
#qlocal_ip=fd53:7cb8:383:7c::1
#qremote_ip=fd53:7cb8:383:7c::2

#qlocal_port=5010
#clocal_port=5030
#Description :- The local TCP ip port of the  connected device. (Mandatory parameter)
#Supports:- all positive integers < 10000
#Userintervention:- change it if required (optional)

#qremote_port=5020
#cremote_port=5040
#Description :- The remote TCP ip port of the remote connected device. (Mandatory parameter)
#Supports:- all positive integers < 10000
#Userintervention:- change it if required (optional)

#qvlan_id=124
#cvlan_id=126
#Description :- The VLAN id to be created on connected device. (Mandatory parameter)
#Supports:- all positive integers < 4095
#Userintervention:- change it if required (optional) it is suggested not to though. as QCMAP also creates VLAN and this is reserved for us.
#Userintervention:- If you as a customer is not using QCMAP then feel free to use any VLAN id.

#cvlan_tpid=33024
#cvlan_pcp=0
#cvlan_dei=0
#Description :- The VLAN id to be created on connected device. (Mandatory parameter)
#Userintervention:- Do not change these parameters

#qlocal_macid=00:55:7B:B5:7D:a2
#Description :- The local mac id to be changed on connected device. (optional parameter)
#Supports:- valid mac address
#Userintervention:- change it if required (optional)

#qremote_macid=00:55:7B:B5:7D:a4
#Description :- The remote mac id to be changed on remote connected device. (optional parameter)
#Supports:- valid mac address
#Userintervention:- change it if required (optional)

#qip_type=IPv4
#Description :- The current ip type supported on connected device. (Mandatory parameter)
#Supports:- Valid string (IPv4 or IPv6) Case sensitve
#Userintervention:- change it if required (optional) to IPv6

#Uncomment the below to support IPv6 and comment out the qip_type=IPv4
#qip_type=IPv6

#qinterface=eth0
#Description :- The parent interface for VLAN on connected device. (Mandatory parameter)
#Supports:- Valid string example eth0
#Userintervention:- Do not change this parameter

#qprotocol=QOE
#cprotocol=Cv2X
#Description :- to enable or disable feature. enabled by default on supporting (Mandatory parameter)
#Supports:- Valid string example QOE or Cv2X
#Userintervention:- Do not change this parameter

#*************Default QOE Config **************#

qlocal_ip=192.168.1.3
qremote_ip=192.168.1.5
qlocal_port=5010
qremote_port=5020
qvlan_id=124
qlocal_macid=00:55:7B:B5:7D:a2
qremote_macid=00:55:7B:B5:7D:a4
qip_type=IPv4
qinterface=eth0
qprotocol=QOE

#*************Default Cv2X Config **************#

clocal_port=5030
cremote_port=5040
cvlan_tpid=33024
cvlan_pcp=0
cvlan_dei=0
cvlan_id=126
clocal_macid=00:55:7B:B5:7D:a1
cremote_macid=00:55:7B:B5:7D:a3
cip_type=IPv4
cinterface=eth0
cprotocol=Cv2X
