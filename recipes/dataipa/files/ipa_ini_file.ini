#VLAN configurations
use_vlan_eth_emac_config=no
use_vlan_eth0_config=no
use_vlan_eth1_config=no
use_vlan_rndis_config=no
use_vlan_ecm_config=no
use_vlan_mhi_eth_config=no

#MHI config
use_mhi_config=no
use_mhi_eth_config=no

#Qos config
use_eth_qos_config=yes

#TSN config
use_tsn_config=no

#ezmesh config
use_ezmesh_config=no

#RDKB config
use_rdkb_config=no

#Ipsec config
use_ipsec_config=no

#IPv6 NAT config
use_ipv6_nat_config=no

#stats config
ipa_disable_per_flow_stats=no

# 1024 is the absolute ceiling on accelerated stats connections, shared
# across IPv4 and IPv6. The values below express the per-family limit only;
# they do NOT guarantee 1024 IPv4 + 1024 IPv6 connections concurrently. The
# combined IPv4 and IPv6 count cannot exceed the shared 1024 hardware limit.
max_ipv4_stats_accel_conn=1024
max_ipv6_stats_accel_conn=1024

#dtsi fields config
ipa_wdi3_2g_holb_timeout=15
ipa_wdi3_5g_holb_timeout=31
tx_wrapper_cache_max_size=400
ipa_wan_skb_page=yes
filter_start_id=768
wan_rx_ring_size=224
lan_rx_ring_size=192
ipa_gen_rx_cmn_page_pool_sz_factor=5
ipa_gen_rx_cmn_temp_pool_sz_factor=3
